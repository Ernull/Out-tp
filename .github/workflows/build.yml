name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Fresh Project & Build
        run: |
          # ۱. ساخت پروژه جدید با شناسه اختصاصی
          flutter create --org com.erfan.tapsilink clean_tapsi_app
          
          # ۲. کپی کدهای پروژه
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart clean_tapsi_app/lib/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart clean_tapsi_app/lib/main.dart
          fi
          cp pubspec.yaml clean_tapsi_app/pubspec.yaml
          if [ -f "icon.png" ]; then cp icon.png clean_tapsi_app/icon.png; fi
          
          cd clean_tapsi_app
          
          # ۳. تزریق مجوزهای اینترنت، موقعیت مکانی (GPS برای نقشه تپسی/اکالا) و پشتیبانی از ترافیک وب
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' android/app/src/main/AndroidManifest.xml
          
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle.kts
          fi
          
          # ۴. دانلود پکیج‌ها
          flutter pub get
          
          # ۵. تغییر اسم برنامه به Tapsi link
          flutter pub run rename_app:main all="Tapsi link"
          
          # ۶. ساخت اتوماتیک آیکون جدید
          if [ -f "icon.png" ]; then flutter pub run flutter_launcher_icons; fi
          
          # ۷. رفع باگ Proguard هوشمند برای نسخه‌های جدید
          find ~/.pub-cache/hosted/pub.dev/ -type f -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
          
          # ۸. بیلد نهایی
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapsi-Client-Release
          path: clean_tapsi_app/build/app/outputs/flutter-apk/app-release.apk
