name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Fresh Project & Build
        run: |
          # ۱. ساخت پروژه جدید با شناسه اختصاصی
          flutter create --org com.erfan.tapsilink clean_tapsi_app
          
          # ۲. کپی کدهای شما و عکس آیکون
          cp lib/main.dart clean_tapsi_app/lib/main.dart
          if [ -f "icon.png" ]; then cp icon.png clean_tapsi_app/icon.png; fi
          
          cd clean_tapsi_app
          
          # ۳. تزریق مجوز اینترنت
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # ۴. دانلود پکیج‌های اصلی و ابزارهای آیکون/اسم
          flutter pub add http shared_preferences flutter_inappwebview dio
          flutter pub add --dev flutter_launcher_icons rename_app
          
          # ۵. تغییر اسم برنامه به Tapsi link
          flutter pub run rename_app:main all="Tapsi link"
          
          # ۶. 🪄 ساخت اتوماتیک آیکون جدید (ارور فاصله‌گذاری برطرف شد) 🪄
          if [ -f "icon.png" ]; then
            echo "" >> pubspec.yaml
            echo "flutter_launcher_icons:" >> pubspec.yaml
            echo "  android: \"launcher_icon\"" >> pubspec.yaml
            echo "  image_path: \"icon.png\"" >> pubspec.yaml
            echo "  min_sdk_android: 21" >> pubspec.yaml
            flutter pub run flutter_launcher_icons
          fi
          
          # ۷. رفع باگ Proguard
          find ~/.pub-cache/hosted/pub.dev/ -type f -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
          
          # ۸. بیلد نهایی
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapsi-Client-Release
          path: clean_tapsi_app/build/app/outputs/flutter-apk/app-release.apk
