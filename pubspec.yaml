name: premium_client
description: A secure Flutter client for Tapsi and Okala integration.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.2
  
  # Packages for Network and WebView
  http: ^1.1.0
  dio: ^5.4.3
  flutter_inappwebview: ^6.0.0
  
  # Packages for Debug Logger
  path_provider: ^2.1.2
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
