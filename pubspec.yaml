name: enterprise_secure_portal
description: Enterprise Secure Portal - Authorized Session Restoration

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_inappwebview: ^6.0.0
  rename_app: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0C10"
  adaptive_icon_foreground: "icon.png"

flutter:
  uses-material-design: true
